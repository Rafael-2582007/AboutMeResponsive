<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Me | Rafael Alfaro Ataupah</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <a class="site-logo" href="index.html">
            <img
                src="logo.png"
            >
        </a>

        <h1>HUBUNGI SAYA</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="biodata.html">Biodata</a>
        <a href="myHoliday.html">My Holiday</a>
        <a href="contact.html" aria-current="page">Contact Me</a>
    </nav>

    <main>

        <section id="contact">
            <h2>Hubungi Saya</h2>
            <form>
                <div class="form-group">
                    <label for="NamaLengkap">Nama Lengkap</label>
                    <input
                        type="text"
                        id="NamaLengkap"
                        name="nama"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                    ></textarea>
                </div>

                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© Rafael Alfaro Ataupah | 2026</p>
        <p>Sistem Informasi FTI UNAI</p>
    </footer>

</body>
</html>
